name: ChatToPaper QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://chattopaper.com
      FREE_LAUNCH: "true"
      PLAYWRIGHT_USE_SYSTEM_CHROME: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Unit and integration tests
        run: npm test
      - name: Build production static site
        run: node build.cjs && node scripts/verify-seo.cjs
      - name: Install browser QA dependency
        run: npm install --no-save playwright@1.62.1
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Browser end-to-end flow
        run: node tests/e2e.cjs
      - name: Install Neon function bundler dependencies
        run: npm install --no-save pg @neon/functions esbuild
      - name: Bundle Neon PDF counter function
        run: |
          mkdir -p neon-counter-dist
          ./node_modules/.bin/esbuild neon-counter/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=neon-counter-dist/index.mjs
          cd neon-counter-dist
          zip -j ../neon-counter-function.zip index.mjs
      - name: Upload Neon function bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-counter-function
          path: neon-counter-function.zip
          if-no-files-found: error
          retention-days: 1
