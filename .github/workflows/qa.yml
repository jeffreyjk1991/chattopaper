name: ChatToPaper QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://chattopaper.com
      FREE_LAUNCH: "true"
      PLAYWRIGHT_USE_SYSTEM_CHROME: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Unit and integration tests
        run: npm test
      - name: Build production static site
        run: node build.cjs && node scripts/verify-seo.cjs
      - name: Install browser QA dependency
        run: npm install --no-save playwright@1.62.1
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Browser end-to-end flow
        run: node tests/e2e.cjs
      - name: Verify production attribution write
        if: contains(github.event.head_commit.message, '[verify-attribution]')
        run: |
          set -e
          curl --fail --show-error --silent --retry 6 --retry-delay 3 \
            -X POST https://chattopaper.com/api/pdf-count \
            -H 'Origin: https://chattopaper.com' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: ChatToPaper-QA/1.0' \
            --data '{"eventId":"11111111-1111-4111-8111-111111111141","referrerHost":"qa.chattopaper.test","utmSource":"qa","utmMedium":"test","utmCampaign":"attribution-check","landingPage":"/qa-attribution/"}'

