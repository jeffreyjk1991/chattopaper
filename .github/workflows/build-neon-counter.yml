name: Build Neon Counter Function

on:
  push:
    branches: [main]
    paths:
      - 'neon-counter/index.mjs'
      - '.github/workflows/build-neon-counter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Build function bundle
        run: |
          set -euo pipefail
          npm install --no-save pg@8.13.1 @neon/functions@0.8.0 esbuild@0.25.11
          mkdir -p neon-counter-bundle
          npx esbuild neon-counter/index.mjs \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node24 \
            --banner:js="import { createRequire } from 'module'; const require = createRequire(import.meta.url);" \
            --outfile=neon-counter-bundle/index.mjs
          cd neon-counter-bundle
          zip -q ../neon-counter-function.zip index.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-counter-function
          path: neon-counter-function.zip
          if-no-files-found: error

      - name: Publish temporary deploy bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 -w0 neon-counter-function.zip > function.b64
          encoded="$(base64 -w0 function.b64)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/neon-counter/function.b64" --jq .sha 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/neon-counter/function.b64" \
              -f message="Update temporary Neon function bundle" \
              -f content="$encoded" \
              -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/neon-counter/function.b64" \
              -f message="Publish temporary Neon function bundle" \
              -f content="$encoded" >/dev/null
          fi
